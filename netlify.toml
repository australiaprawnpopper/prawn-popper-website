# Netlify 部署配置文件
[build]
  # 构建命令
  command = "npm run build"
  
  # 发布目录（Vite 默认输出目录）
  publish = "dist"

# 重定向规则 - 确保 SPA 路由正常工作
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 自定义头部 - 安全和性能优化
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 缓存静态资源
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTTPS 重定向
[[redirects]]
  from = "http://prawnpopper.com.au/*"
  to = "https://prawnpopper.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.prawnpopper.com.au/*"
  to = "https://www.prawnpopper.com.au/:splat"
  status = 301
  force = true
